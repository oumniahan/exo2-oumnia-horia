<section class="text-center">
  <h2 class="page-title mb-4">Nos 5 films préférés</h2>

  <div class="liste mx-auto d-flex flex-column gap-2">
    @for (film of films; track film.titre; let i = $index) {
      <a class="film" [class.active]="film === filmChoisi" (click)="choisirFilm(film)">
        <span class="numero">{{ i + 1 }}</span>
        <span class="nom-film">{{ film.titre }}</span>
      </a>
    }
  </div>

  @if (filmChoisi) {
    <div class="mt-5">
      <h3 class="mb-3">{{ filmChoisi.titre }}</h3>
      <img [src]="filmChoisi.affiche" [alt]="'Affiche de ' + filmChoisi.titre" class="affiche">
    </div>
  }
</section>
